# /etc/nginx/sites-available/freezme-api
# Symlink to /etc/nginx/sites-enabled/freezme-api

upstream freezme_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name api.freezme.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.freezme.app;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/api.freezme.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.freezme.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;

    # REST API + WebSocket upgrade
    location / {
        proxy_pass         http://freezme_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # Health check — no logging
    location /health {
        proxy_pass http://freezme_backend;
        access_log off;
    }
}
