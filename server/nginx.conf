# /etc/nginx/sites-available/freezme-api
# Symlink to /etc/nginx/sites-enabled/freezme-api

# Rate limiting zones (defined in http block — include this file from nginx.conf or define there)
# Limit by IP: 30 requests/second burst 60 — handles normal bursts while blocking floods
limit_req_zone $binary_remote_addr zone=freezme_global:10m rate=30r/s;
# Tighter limit for auth endpoints — 5 req/s per IP
limit_req_zone $binary_remote_addr zone=freezme_auth:10m rate=5r/s;

upstream freezme_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name api.freezme.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.freezme.app;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/api.freezme.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.freezme.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;

    # Edge rate limiting — first line of defence before Express
    limit_req zone=freezme_global burst=60 nodelay;
    limit_req_status 429;

    # WebSocket endpoint — needs long timeout for persistent connections
    location /socket.io/ {
        proxy_pass         http://freezme_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # REST API — short timeout to fail fast on hung requests
    location / {
        proxy_pass         http://freezme_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # Auth endpoints — stricter rate limit
    location /auth/ {
        limit_req zone=freezme_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://freezme_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  30s;
        proxy_send_timeout  30s;
    }

    # Health check — no logging, no rate limit
    location /health {
        proxy_pass http://freezme_backend;
        access_log off;
        limit_req_exempt on;
    }
}
