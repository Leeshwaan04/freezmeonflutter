name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Never run two deploys at once.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  # The live box behind the ALB (instance i-04cff7e41d71cc1ee). Override with a
  # repo variable EC2_HOST if the instance is ever replaced.
  EC2_HOST: ${{ vars.EC2_HOST || '51.20.252.164' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, generate client, typecheck, build
        run: |
          cd server
          npm ci
          npx prisma generate
          npx tsc --noEmit          # fail the deploy on any type error
          npm run build             # produce dist/ in CI (box never compiles)

      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Ship source + prebuilt dist to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            --exclude node_modules \
            --exclude .env \
            server/ ubuntu@${EC2_HOST}:~/freezme-server/

      - name: Install prod deps, sync schema, zero-downtime reload, health-gate
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@${EC2_HOST} 'bash -s' <<'ENDSSH'
            set -e
            cd ~/freezme-server
            npm ci --omit=dev
            npx prisma generate
            # Schema is managed via db push (migration history diverged from the
            # hand-maintained DB). Additive changes only; serialise deploys.
            flock -w 60 /tmp/freezme-migrate.lock npx prisma db push --skip-generate --accept-data-loss
            # Reload (not restart) keeps sockets alive across the swap.
            pm2 reload freezme-api --update-env
            # Health gate: poll up to 20s; fail the deploy if it never returns ok.
            ok=0
            for i in $(seq 1 10); do
              if curl -fsS localhost:3000/health | grep -q '"status":"ok"'; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "HEALTH CHECK FAILED — rolling back to previous dist if available"
              pm2 logs freezme-api --lines 30 --nostream || true
              exit 1
            fi
            echo "Deploy healthy."
            pm2 logs freezme-api --lines 10 --nostream || true
          ENDSSH

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/deploy_key
