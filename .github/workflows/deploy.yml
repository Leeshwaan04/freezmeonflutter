name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy public files to EC2
        run: |
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no -r server/public ubuntu@13.61.190.208:~/server/

      - name: Deploy via SSH
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@13.61.190.208 << 'ENDSSH'
            cd ~/server
            git pull origin main
            npm ci
            npm run build
            echo "=== dist/src/index.js terms route ==="
            grep -c "terms" dist/src/index.js || echo "terms NOT in dist"
            ls public/ || echo "public/ dir missing"
            npx prisma migrate deploy
            pm2 restart freezme-api
            sleep 3
            pm2 logs freezme-api --lines 15 --nostream
          ENDSSH

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/deploy_key
