<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple Heart -->
  <path d="M60 108C30 80 10 60 10 38C10 20 23 8 40 8C52 8 58 15 60 20C62 15 68 8 80 8C97 8 110 20 110 38C110 60 90 80 60 108Z" fill="#6C4B9C"/>
  
  <!-- White Snowflake (6-arm Pattern) -->
  <g transform="translate(60, 58)" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Arm 1 (0 deg) -->
      <g>
        <line x1="0" y1="0" x2="0" y2="-32" />
        <path d="M-8 -20 L0 -32 L8 -20" fill="none" />
      </g>
      <!-- Arm 2 (60 deg) -->
      <g transform="rotate(60)">
        <line x1="0" y1="0" x2="0" y2="-32" />
        <path d="M-8 -20 L0 -32 L8 -20" fill="none" />
      </g>
      <!-- Arm 3 (120 deg) -->
      <g transform="rotate(120)">
        <line x1="0" y1="0" x2="0" y2="-32" />
        <path d="M-8 -20 L0 -32 L8 -20" fill="none" />
      </g>
      <!-- Arm 4 (180 deg) -->
      <g transform="rotate(180)">
        <line x1="0" y1="0" x2="0" y2="-32" />
        <path d="M-8 -20 L0 -32 L8 -20" fill="none" />
      </g>
      <!-- Arm 5 (240 deg) -->
      <g transform="rotate(240)">
        <line x1="0" y1="0" x2="0" y2="-32" />
        <path d="M-8 -20 L0 -32 L8 -20" fill="none" />
      </g>
      <!-- Arm 6 (300 deg) -->
      <g transform="rotate(300)">
        <line x1="0" y1="0" x2="0" y2="-32" />
        <path d="M-8 -20 L0 -32 L8 -20" fill="none" />
      </g>
  </g>
</svg>